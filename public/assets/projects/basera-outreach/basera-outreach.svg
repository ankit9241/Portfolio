<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E1E0CC"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#14151a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A67D8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="280" cy="180" r="180" fill="#F59E0B" fill-opacity="0.06" filter="url(#glow)"/>
  <circle cx="920" cy="420" r="220" fill="#5A67D8" fill-opacity="0.06" filter="url(#glow)"/>

  <!-- Top Navigation / Brand Bar -->
  <g transform="translate(100, 48)">
    <rect width="1000" height="64" rx="16" fill="#15161c" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <!-- Logo & Title -->
    <rect x="20" y="16" width="32" height="32" rx="8" fill="url(#accentGrad)"/>
    <path d="M 28 34 L 36 24 L 44 34 Z" fill="#0c0d10"/>
    <text x="64" y="37" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" letter-spacing="0.5">BASERA OUTREACH</text>
    <text x="238" y="36" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="12">|  FIELD AUDIT &amp; PG VERIFICATION</text>

    <!-- Status Badges -->
    <rect x="740" y="18" width="115" height="28" rx="14" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.3"/>
    <circle cx="754" cy="32" r="4" fill="#F59E0B"/>
    <text x="766" y="36" fill="#F59E0B" font-family="monospace" font-weight="600" font-size="11">OFFLINE-FIRST</text>

    <rect x="868" y="18" width="112" height="28" rx="14" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
    <circle cx="882" cy="32" r="4" fill="#10B981"/>
    <text x="894" y="36" fill="#10B981" font-family="monospace" font-weight="600" font-size="11">SYNC ACTIVE</text>
  </g>

  <!-- Main Content Layout (Two Column Mockup) -->

  <!-- Left Card: Mobile Field Device Mockup / Form Preview -->
  <g transform="translate(100, 136)" filter="url(#cardShadow)">
    <rect width="420" height="480" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
    
    <!-- Mobile App Header Inside Card -->
    <rect x="24" y="24" width="372" height="48" rx="12" fill="#121318" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="40" y="53" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14">Property Verification Audit</text>
    <rect x="290" y="34" width="94" height="24" rx="6" fill="#5A67D8" fill-opacity="0.2"/>
    <text x="302" y="50" fill="#A5B4FC" font-family="monospace" font-size="10" font-weight="600">IDB: 14 RECS</text>

    <!-- Field Audit Form Preview Items -->
    <g transform="translate(24, 88)">
      <!-- Input 1 -->
      <text x="0" y="12" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">PG Name &amp; Cluster</text>
      <rect x="0" y="18" width="372" height="38" rx="8" fill="#101115" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="14" y="42" fill="#E1E0CC" font-family="system-ui, -apple-system, sans-serif" font-size="13">Sunrise Student Living - North Campus</text>

      <!-- Input 2: Two Columns -->
      <g transform="translate(0, 70)">
        <text x="0" y="12" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">Room Types</text>
        <rect x="0" y="18" width="180" height="38" rx="8" fill="#101115" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="14" y="42" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12">Double &amp; Triple Sharing</text>

        <text x="192" y="12" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">Starting Rent</text>
        <rect x="192" y="18" width="180" height="38" rx="8" fill="#101115" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="206" y="42" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12">Rs. 11,500 / mo</text>
      </g>

      <!-- Photo Upload Queue Section -->
      <g transform="translate(0, 142)">
        <text x="0" y="12" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">On-Site Photos (AWS S3 Presigned)</text>
        <g transform="translate(0, 20)">
          <!-- Photo Thumbnails -->
          <rect x="0" y="0" width="84" height="64" rx="8" fill="#15161d" stroke="#10B981" stroke-width="1.5"/>
          <text x="16" y="36" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10">Exterior ✓</text>
          
          <rect x="96" y="0" width="84" height="64" rx="8" fill="#15161d" stroke="#10B981" stroke-width="1.5"/>
          <text x="114" y="36" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10">Room 1 ✓</text>
          
          <rect x="192" y="0" width="84" height="64" rx="8" fill="#15161d" stroke="#F59E0B" stroke-width="1.5"/>
          <text x="208" y="36" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Washroom ⟳</text>
          
          <rect x="288" y="0" width="84" height="64" rx="8" fill="#15161d" stroke="#ffffff" stroke-dasharray="3,3" stroke-opacity="0.2"/>
          <text x="318" y="37" fill="#666677" font-family="system-ui, -apple-system, sans-serif" font-size="18">+</text>
        </g>
      </g>

      <!-- Save Button -->
      <g transform="translate(0, 246)">
        <rect x="0" y="0" width="372" height="42" rx="10" fill="#E1E0CC"/>
        <text x="120" y="26" fill="#0c0d10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13">SAVE RECORD OFFLINE</text>
      </g>
    </g>
  </g>

  <!-- Right Card: System Architecture & Sync Flow -->
  <g transform="translate(550, 136)" filter="url(#cardShadow)">
    <rect width="550" height="480" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
    
    <!-- Header -->
    <text x="32" y="44" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17">OFFLINE-FIRST ARCHITECTURE</text>
    <text x="32" y="66" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="12">Local-First Persistence &amp; Cloud Reconciliation Pipeline</text>

    <!-- Architecture Flow Blocks -->
    <g transform="translate(32, 92)">
      <!-- Step 1: Field Device -->
      <rect x="0" y="0" width="486" height="60" rx="10" fill="#14151b" stroke="#F59E0B" stroke-opacity="0.3"/>
      <circle cx="28" cy="30" r="14" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="24" y="34" fill="#F59E0B" font-family="monospace" font-weight="700" font-size="12">1</text>
      <text x="56" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Field Data Entry (React + PWA)</text>
      <text x="56" y="44" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent captures verification specs and camera photos on-site</text>

      <!-- Arrow Down 1 -->
      <path d="M 243 62 L 243 76 M 238 72 L 243 78 L 248 72" stroke="#F59E0B" stroke-width="2" fill="none"/>

      <!-- Step 2: Local IndexedDB -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="486" height="60" rx="10" fill="#14151b" stroke="#3B82F6" stroke-opacity="0.3"/>
        <circle cx="28" cy="30" r="14" fill="#3B82F6" fill-opacity="0.2"/>
        <text x="24" y="34" fill="#3B82F6" font-family="monospace" font-weight="700" font-size="12">2</text>
        <text x="56" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">IndexedDB + Dexie.js Local Storage</text>
        <text x="56" y="44" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">Immediate write to device database; changes queued with state flags</text>
      </g>

      <!-- Arrow Down 2 -->
      <path d="M 243 142 L 243 156 M 238 152 L 243 158 L 248 152" stroke="#3B82F6" stroke-width="2" fill="none"/>

      <!-- Step 3: Sync Queue Dispatcher -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="486" height="60" rx="10" fill="#14151b" stroke="#A855F7" stroke-opacity="0.3"/>
        <circle cx="28" cy="30" r="14" fill="#A855F7" fill-opacity="0.2"/>
        <text x="24" y="34" fill="#A855F7" font-family="monospace" font-weight="700" font-size="12">3</text>
        <text x="56" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Sync Queue &amp; Online Reconnection</text>
        <text x="56" y="44" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">Connection listener triggers atomic batch replay upon signal return</text>
      </g>

      <!-- Arrow Down 3 -->
      <path d="M 243 222 L 243 236 M 238 232 L 243 238 L 248 232" stroke="#A855F7" stroke-width="2" fill="none"/>

      <!-- Step 4: Backend & Cloud S3 -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="486" height="60" rx="10" fill="#14151b" stroke="#10B981" stroke-opacity="0.3"/>
        <circle cx="28" cy="30" r="14" fill="#10B981" fill-opacity="0.2"/>
        <text x="24" y="34" fill="#10B981" font-family="monospace" font-weight="700" font-size="12">4</text>
        <text x="56" y="26" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Node.js + PostgreSQL + AWS S3 Direct Upload</text>
        <text x="56" y="44" fill="#888899" font-family="system-ui, -apple-system, sans-serif" font-size="11">Presigned S3 multipart uploads &amp; transactional relational storage</text>
      </g>
    </g>

    <!-- Key Stats Footer in Card -->
    <g transform="translate(32, 412)">
      <rect width="486" height="42" rx="8" fill="#101116" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="16" y="26" fill="#A5B4FC" font-family="monospace" font-size="11">TECH: React · Dexie.js · IndexedDB · Express · PostgreSQL · Prisma · AWS S3</text>
    </g>
  </g>
</svg>
